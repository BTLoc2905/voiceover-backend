name: VoiceMap CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Verify backend
        run: ./mvnw -B verify

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceover-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voiceover-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: node --test
      - name: Build frontend
        run: npm run build

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: python -m pip install -r requirements-edge-tts.txt
      - name: Run offline worker tests
        run: python -m unittest discover -s scripts -p test_edge_tts_worker.py

  mysql-integration-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: voiceover-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvoiceover-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run MySQL integration tests
        env:
          POI_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectTimeout=3000
          POI_TEST_DB_USER: root
          POI_TEST_DB_PASSWORD: voiceover-ci-root
          PIPELINE_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectTimeout=3000
          PIPELINE_TEST_DB_USER: root
          PIPELINE_TEST_DB_PASSWORD: voiceover-ci-root
        run: >-
          ./mvnw -B
          -Dpoi.mysql.integration=true
          -Dpipeline.mysql.integration=true
          -Dtest=ContentPipelineMySqlTest,PoiHiddenMySqlTest,RouteIndependenceMySqlTest
          test
      - name: Verify all MySQL test reports have executed tests without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "TEST-com.voiceover.backend.services.ContentPipelineMySqlTest.xml",
              "TEST-com.voiceover.backend.services.PoiHiddenMySqlTest.xml",
              "TEST-com.voiceover.backend.services.RouteIndependenceMySqlTest.xml",
          }
          reports = Path("target/surefire-reports")
          for name in sorted(expected):
              report = reports / name
              if not report.is_file():
                  raise SystemExit(f"Missing MySQL integration report: {report}")
              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              if tests == 0 or skipped:
                  raise SystemExit(
                      f"{name}: expected executed tests with no skips; "
                      f"tests={tests}, skipped={skipped}"
                  )
              print(f"{name}: PASS ({tests} tests, {skipped} skipped)")

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-test
      - frontend-test
      - python-test
      - mysql-integration-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha
          type=raw,value=latest
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}