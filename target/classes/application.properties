spring.application.name=voiceover-backend
server.port=8080

# Kết nối CSDL (Tự động tạo database voicemap_db nếu chưa tồn tại)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/voicemap_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration (Nạp sẵn V1..V4)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# Phục vụ trực tiếp file âm thanh .mp3 đã sinh ra từ kho lưu trữ
spring.web.resources.static-locations=classpath:/static/,file:./storage/

# API keys: chỉ truyền qua biến môi trường, không ghi key thật vào file này.
# GOOGLE_CLOUD_API_KEY: Translation API + Text-to-Speech API
# OPENAI_API_KEY: Images API để tạo ảnh POI
openai.api.key=${OPENAI_API_KEY:}
google.cloud.api.key=${GOOGLE_CLOUD_API_KEY:}
app.audio.storage=${AUDIO_STORAGE:storage/audio}
app.image.storage=${IMAGE_STORAGE:storage/images}
# Optional local Piper TTS. Leave blank to use browser SpeechSynthesis.
app.piper.executable=${PIPER_EXECUTABLE:}
app.piper.model=${PIPER_MODEL:}

# UC03: a server running the walking profile (a driving server is not interchangeable).
app.routing.walking-url=${WALKING_ROUTING_URL:https://routing.openstreetmap.de/routed-foot/route/v1/foot}
app.routing.min-interval-ms=${WALKING_ROUTING_MIN_INTERVAL_MS:1100}
