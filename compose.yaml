name: voicemap

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voicemap_db}
      MYSQL_USER: ${MYSQL_USER:-voicemap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          -Nse 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    image: voicemap-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-voicemap_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-voicemap}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_OPEN_IN_VIEW: "false"
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      EDGE_TTS_PYTHON: /opt/edge-tts/bin/python
      EDGE_TTS_WORKER: /app/scripts/edge_tts_worker.py
      EDGE_TTS_TIMEOUT_SECONDS: ${EDGE_TTS_TIMEOUT_SECONDS:-90}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      AUDIO_STORAGE: /app/storage/audio
      IMAGE_STORAGE: /app/storage/images
    volumes:
      - audio_data:/app/storage/audio
      - image_data:/app/storage/images
    healthcheck:
      test:
        - CMD
        - /opt/edge-tts/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/public/languages', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    image: voicemap-frontend:latest
    build:
      context: ./voiceover-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql_data:
  audio_data:
  image_data:
